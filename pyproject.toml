[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queenbee-planner"
version = "0.1.0"
description = "QueenBee-Evo: evolving the communication program of a team of frozen LLM workers"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "openai>=1.40,<3",
    "httpx>=0.27",
    "pyflakes>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
queenbee-evo = "queenbee.evo.loop:cli"
queenbee-ladder = "queenbee.evo.ladder:main"
queenbee-eval = "queenbee.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
